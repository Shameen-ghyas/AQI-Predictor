name: Feature Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Normalize requirements encoding
        run: |
          python - <<'PY'
          import io
          path = 'requirements.txt'
          try:
              with open(path, 'r', encoding='utf-8') as f:
                  f.read()
              print('requirements.txt is utf-8')
          except Exception:
              for enc in ('utf-16', 'utf-16-le', 'utf-16-be', 'utf-32'):
                  try:
                      with open(path, 'r', encoding=enc) as f:
                          data = f.read()
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(data)
                      print(f'Re-encoded requirements.txt from {enc} to utf-8')
                      break
                  except Exception:
                      continue
          PY

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip check
          echo "--- pip freeze ---"
          .venv/bin/python -m pip freeze
          echo "--- verify runtime imports ---"
          .venv/bin/python - <<'PY'
          try:
            import dotenv
            import holidays
            import pyarrow
            import sys
            print('python executable:', sys.executable)
            print('dotenv OK', getattr(dotenv, '__version__', 'no-version'))
            print('holidays OK', getattr(holidays, '__version__', 'no-version'))
            print('pyarrow OK', getattr(pyarrow, '__version__', 'no-version'))
          except Exception as e:
            print('runtime import check failed:', type(e).__name__, e)
            sys.exit(2)
          PY

      - name: Run feature script
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: .venv/bin/python src/main.py